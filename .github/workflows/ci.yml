name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, curl, pdo_sqlite
          coverage: none

      - name: PHP-Syntax prüfen
        run: |
          mapfile -d '' files < <(find . -name '*.php' -not -path './data/*' -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Keine PHP-Dateien gefunden."
            exit 1
          fi
          status=0
          for f in "${files[@]}"; do
            php -l "$f" || status=1
          done
          exit "$status"

      - name: Kernfunktionen laden
        run: php -r 'require "lib.php"; echo "APP_VERSION=" . APP_VERSION, PHP_EOL;'
